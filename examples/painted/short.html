<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tomato pasta in 15 minutes</title>
<!-- Fonts: Google Fonts, loaded at render time (needs internet once; Chrome caches them). display=block avoids a fallback-font frame. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,900;1,9..144,900&family=Nunito:wght@700;800;900&display=block">
<link rel="stylesheet" href="../../engine/core.css">
<style>
/* Painted storybook look: warm paper, soft brown ink (never black), rounded type. Captions stay inside y 1340..1560. */
:root{--ink:#4a3426;--cream:#fbf3e2;--gold:#ffd36b;--red:#d8403a}
#v{background:#f1dfbd;font-family:Nunito,sans-serif}
#cap{z-index:10;top:1370px;left:60px;right:120px;font:900 66px/1.08 Nunito,sans-serif;text-transform:none;letter-spacing:0;color:#fffaf0;
  -webkit-text-stroke:14px var(--ink);paint-order:stroke fill;filter:drop-shadow(0 6px 0 rgba(74,52,38,.35))}
#cap b{color:var(--gold);font-weight:900}
#grain{opacity:.06}
#paper{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.18;background-size:512px 512px}
#vig{background:radial-gradient(ellipse 85% 65% at 50% 45%,transparent 55%,rgba(60,30,10,.35) 100%)}
.dish{font:italic 900 150px/.95 Fraunces,serif;color:var(--cream);-webkit-text-stroke:14px var(--ink);paint-order:stroke fill;filter:drop-shadow(0 10px 0 rgba(42,70,110,.45))}
.stat{width:280px;height:170px;background:var(--cream);border:6px solid var(--ink);border-radius:34px;box-shadow:0 10px 0 rgba(42,70,110,.35);
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink)}
.stat b{font:900 70px/1 Fraunces,serif}
.stat b i{font-style:normal;color:var(--red)}
.stat small{font:800 26px Nunito;opacity:.8}
.step{display:inline-flex;align-items:center;gap:20px;background:var(--cream);border:6px solid var(--ink);border-radius:60px;padding:10px 34px 10px 12px;box-shadow:0 8px 0 rgba(74,52,38,.3);color:var(--ink)}
.step i{width:84px;height:84px;border-radius:50%;background:var(--red);color:var(--cream);font:900 56px/74px Fraunces,serif;text-align:center;font-style:normal;border:5px solid var(--ink)}
.step span{font:900 46px Nunito}
.tip{font:italic 900 72px/1 Fraunces,serif;color:var(--gold);-webkit-text-stroke:12px var(--ink);paint-order:stroke fill}
.recap{background:var(--cream);border:6px solid var(--ink);border-radius:36px;padding:18px 30px 22px;text-align:center;color:var(--ink);box-shadow:0 10px 0 rgba(74,52,38,.3)}
.recap b{display:block;font:italic 900 96px/1.05 Fraunces,serif}
.recap .row{display:flex;justify-content:center;gap:34px;font:900 42px Nunito;margin-top:6px}
.recap .row i{font-style:normal;color:var(--red)}
</style>
</head>
<body>
<div id="v">
  <div id="world"></div>
  <div id="flash"></div>
  <div id="paper"></div>
  <div id="vig"></div>
  <div id="grain"></div>
  <div id="cap"></div>
</div>
<script src="timeline.js"></script>
<!-- painted.js draws everything; toon.js + paper.js are here only for Paper.paperTile() (the paper grain overlay) -->
<script src="../../engine/styles/toon.js"></script>
<script src="../../engine/styles/paper.js"></script>
<script src="../../engine/styles/painted.js"></script>
<script src="../../engine/core.js"></script>
<script src="scenes.js"></script>
<script>
document.getElementById('paper').style.backgroundImage = `url(${Paper.paperTile()})`;
Short.start(async () => buildEpisode(document.getElementById('world'), Short),
  {fonts: ['italic 900 100px Fraunces', '900 100px Fraunces', '900 60px Nunito', '800 30px Nunito']});
</script>
</body>
</html>
