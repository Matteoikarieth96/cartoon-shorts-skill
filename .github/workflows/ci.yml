name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          python3 -m pip install numpy
          # headless Chrome on Ubuntu 24.04 needs unprivileged user namespaces for its sandbox
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          google-chrome --version
      - name: Syntax
        run: |
          for f in engine/*.mjs engine/*.js engine/styles/*.js; do node --check "$f"; done
          python3 -m py_compile engine/*.py scripts/*.py
      - name: Tests
        run: python3 -m unittest discover -s tests -v
